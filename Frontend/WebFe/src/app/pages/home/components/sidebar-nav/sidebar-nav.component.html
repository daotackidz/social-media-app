<!-- Spacer: reserves the collapsed rail's width in the page's flex layout, since the
     rail itself is position:fixed so it can expand on hover without reflowing the feed. -->
<div class="h-full flex-shrink-0" [style.width.px]="collapsedWidth" aria-hidden="true"></div>

<nav (mouseenter)="onRailEnter()" (mouseleave)="onRailLeave()" [style.width.px]="railWidth()"
  class="fixed left-0 top-0 z-40 flex h-dvh flex-col gap-1 overflow-hidden border-r border-[#dbdbdb] bg-white px-3 pb-6 pt-10 transition-[width] duration-150 ease-out"
  aria-label="Instagram">
  <a routerLink="/home" class="mb-8 flex items-center px-3" [class.justify-center]="!expanded()" aria-label="Instagram">
    @if (expanded()) {
    <img src="/instagram-logo.png" alt="Instagram" class="h-[29px] w-auto" />
    } @else {
    <img src="/icon-192.png" alt="Instagram" class="h-7 w-7 rounded-md" />
    }
  </a>

  <a routerLink="/home"
    class="flex items-center gap-4 whitespace-nowrap rounded-[24px] px-3 py-3 text-[15px] font-bold text-[#262626] transition hover:bg-[#fafafa]"
    [class.justify-center]="!expanded()">
    <img src="/assets/icons/nav-home.svg" alt="" class="h-6 w-6 flex-shrink-0" aria-hidden="true" />
    @if (expanded()) { <span>{{ 'nav.home' | translate }}</span> }
  </a>

  <button type="button" (click)="toggleSearch($event)"
    class="flex items-center gap-4 whitespace-nowrap rounded-[24px] px-3 py-3 text-left text-[15px] text-[#262626] transition hover:bg-[#fafafa]"
    [class.justify-center]="!expanded()" [class.font-bold]="searchOpen()">
    <img src="/assets/icons/nav-search.svg" alt="" class="h-6 w-6 flex-shrink-0" aria-hidden="true" />
    @if (expanded()) { <span>{{ 'nav.search' | translate }}</span> }
  </button>

  @for (item of staticItems; track item.labelKey) {
  <button type="button"
    class="flex items-center gap-4 whitespace-nowrap rounded-[24px] px-3 py-3 text-left text-[15px] text-[#262626] transition hover:bg-[#fafafa]"
    [class.justify-center]="!expanded()">
    <img [src]="item.icon" alt="" class="h-6 w-6 flex-shrink-0" aria-hidden="true" />
    @if (expanded()) { <span>{{ item.labelKey | translate }}</span> }
  </button>
  }

  <div class="relative">
    <button type="button" (click)="toggleCreateMenu(); $event.stopPropagation()"
      class="flex w-full items-center gap-4 whitespace-nowrap rounded-[24px] px-3 py-3 text-left text-[15px] text-[#262626] transition hover:bg-[#fafafa]"
      [class.justify-center]="!expanded()">
      <img src="/assets/icons/nav-create.svg" alt="" class="h-6 w-6 flex-shrink-0" aria-hidden="true" />
      @if (expanded()) { <span>{{ 'nav.create' | translate }}</span> }
    </button>

    @if (createMenuOpen()) {
    <div (click)="$event.stopPropagation()"
      class="absolute left-0 top-full z-20 mt-1 w-56 overflow-hidden rounded-xl border border-[#dbdbdb] bg-white py-2 shadow-lg">
      <button type="button" (click)="selectPost()"
        class="flex w-full items-center gap-3 px-4 py-3 text-left text-sm text-[#262626] hover:bg-[#fafafa]">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="4" />
          <path stroke-linecap="round" d="M12 8v8M8 12h8" />
        </svg>
        {{ 'create.post' | translate }}
      </button>
      <button type="button" (click)="selectStory()"
        class="flex w-full items-center gap-3 px-4 py-3 text-left text-sm text-[#262626] hover:bg-[#fafafa]">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
          <circle cx="12" cy="12" r="9" />
          <path stroke-linecap="round" d="M12 8v8M8 12h8" />
        </svg>
        {{ 'create.story' | translate }}
      </button>
    </div>
    }
  </div>

  <a [routerLink]="['/profile', currentUsername]"
    class="flex items-center gap-4 whitespace-nowrap rounded-[24px] px-3 py-3 text-left text-[15px] text-[#262626] transition hover:bg-[#fafafa]"
    [class.justify-center]="!expanded()">
    @if (avatarUrl) {
    <img [src]="avatarUrl" alt="" class="h-6 w-6 flex-shrink-0 rounded-full object-cover" />
    } @else {
    <span
      class="flex h-6 w-6 flex-shrink-0 items-center justify-center rounded-full text-[10px] font-semibold text-white"
      [style.background]="'#405de6'">{{ avatarInitial }}</span>
    }
    @if (expanded()) { <span>{{ 'nav.profile' | translate }}</span> }
  </a>

  <button type="button"
    class="mt-auto flex items-center gap-4 whitespace-nowrap rounded-[24px] px-3 py-3 text-left text-[15px] text-[#262626] transition hover:bg-[#fafafa]"
    [class.justify-center]="!expanded()">
    <img src="/assets/icons/nav-more.svg" alt="" class="h-6 w-6 flex-shrink-0" aria-hidden="true" />
    @if (expanded()) { <span>{{ 'nav.more' | translate }}</span> }
  </button>
</nav>

@if (searchOpen()) {
<div class="fixed top-0 z-40 h-dvh" [style.left.px]="collapsedWidth" (click)="$event.stopPropagation()">
  <app-search-popup (picked)="closeSearch()" />
</div>
}
