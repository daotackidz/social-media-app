<div class="flex min-h-dvh w-full justify-center bg-white">
  <app-sidebar-nav class="sticky top-0 h-dvh flex-shrink-0" [currentUsername]="currentUser().username" [avatarUrl]="currentUser().avatarUrl" />

  <div class="flex w-full max-w-[1080px] items-start gap-16 px-6 py-9">
    <main class="mx-auto flex w-full max-w-[630px] flex-col gap-4">
      <app-stories-bar [stories]="stories()" />

      @for (post of posts(); track post.id; let i = $index) {
        <app-feed-post [post]="post" />
        @if (showInlineSuggestionsAfter(i)) {
          <app-suggestions-inline [suggestions]="inlineSuggestions()" />
        }
      }

      <!-- Infinite-scroll trigger: the observer in HomeComponent fires loadMorePosts() once this scrolls into view. -->
      <div #scrollSentinel aria-hidden="true"></div>

      @if (postsLoading()) {
      <p class="py-6 text-center text-sm text-[#6a717a]">{{ 'home.loadingPosts' | translate }}</p>
      }

      @if (showCaughtUp()) {
      <div class="flex flex-col items-center gap-3 py-12 text-center">
        <svg width="56" height="56" viewBox="0 0 56 56" aria-hidden="true">
          <defs>
            <linearGradient id="caughtUpRing" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#f9ce34" />
              <stop offset="45%" stop-color="#ee2a7b" />
              <stop offset="100%" stop-color="#6228d7" />
            </linearGradient>
          </defs>
          <circle cx="28" cy="28" r="25" fill="none" stroke="url(#caughtUpRing)" stroke-width="2.5" />
          <path d="M18 29l7 7 14-14" fill="none" stroke="#0c1014" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <p class="text-base font-semibold text-[#0c1014]">{{ 'home.caughtUpTitle' | translate }}</p>
        <p class="max-w-[280px] text-sm text-[#6a717a]">{{ 'home.caughtUpSubtitle' | translate: { days: caughtUpDays() } }}</p>
      </div>
      }
    </main>

    <app-suggestions-panel class="sticky top-6 hidden lg:flex"
      [currentUser]="currentUser()"
      [suggestions]="panelSuggestions()" />
  </div>
</div>
