<div class="flex min-h-dvh w-full justify-center bg-white">
  <app-sidebar-nav class="sticky top-0 h-dvh flex-shrink-0" [currentUsername]="currentUsername()" [avatarUrl]="currentAvatarUrl()" />

  <div class="flex w-full max-w-[935px] flex-col">
    @if (profile(); as p) {
    <main class="flex-1 px-5 py-8 sm:px-10">
      <app-profile-header [profile]="p" />

      @if (highlights().length || p.isCurrentUser) {
      <app-profile-highlights class="mt-8 block" [highlights]="highlights()" [isCurrentUser]="p.isCurrentUser" />
      }

      <hr class="my-8 border-t border-[#dbdbdb]" />

      <app-profile-post-grid [posts]="posts()" [activeTab]="activeTab()" (tabChange)="onTabChange($event)" />
    </main>
    }

    <app-footer />
  </div>
</div>
