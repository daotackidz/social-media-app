<div class="flex gap-6 overflow-x-auto" role="list" aria-label="Highlights">
  @if (isCurrentUser) {
  <div class="flex w-20 flex-shrink-0 flex-col items-center gap-2" role="listitem">
    <button type="button" aria-label="Thêm tin nổi bật"
      class="flex h-16 w-16 items-center justify-center rounded-full border border-dashed border-[#dbdbdb] text-[#262626] hover:border-[#8e8e8e]">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
        <path stroke-linecap="round" d="M12 5v14M5 12h14" />
      </svg>
    </button>
    <span class="max-w-full truncate text-center text-xs text-[#262626]">{{ 'profile.new' | translate }}</span>
  </div>
  }

  @for (highlight of highlights; track highlight.id) {
  <div class="flex w-20 flex-shrink-0 flex-col items-center gap-2" role="listitem">
    @if (highlight.coverUrl) {
    <img [src]="highlight.coverUrl" alt="" loading="lazy" class="h-16 w-16 rounded-full border border-[#dbdbdb] object-cover" />
    } @else {
    <span class="flex h-16 w-16 items-center justify-center rounded-full border border-[#dbdbdb] text-lg font-semibold text-white"
      [style.background]="highlight.avatarColor">{{ highlight.avatarInitial }}</span>
    }
    <span class="max-w-full truncate text-center text-xs text-[#262626]">{{ highlight.title }}</span>
  </div>
  }
</div>
