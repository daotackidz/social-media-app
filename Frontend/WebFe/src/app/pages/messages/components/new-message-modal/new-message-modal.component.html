<div class="flex h-[70vh] max-h-[520px] w-[90vw] max-w-[420px] flex-col rounded-xl bg-white">
  <!-- Header -->
  <div class="relative flex flex-shrink-0 items-center justify-center border-b border-[#dbdbdb] py-3">
    <span class="text-sm font-semibold text-[#262626]">Tin nhắn mới</span>
    <button type="button" (click)="close()" aria-label="Đóng" class="absolute right-3 rounded-full p-1 text-[#262626] hover:bg-[#fafafa]">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path stroke-linecap="round" d="M6 6l12 12M18 6L6 18" />
      </svg>
    </button>
  </div>

  <!-- Recipient picker -->
  <div class="flex flex-shrink-0 flex-wrap items-center gap-2 border-b border-[#dbdbdb] px-4 py-2.5">
    <span class="text-sm font-semibold text-[#262626]">Tới:</span>
    @if (selected(); as user) {
    <span class="flex items-center gap-1.5 rounded-full bg-[#efefef] py-1 pl-1 pr-2 text-sm text-[#262626]">
      @if (user.avatarUrl) {
      <img [src]="user.avatarUrl" alt="" class="h-5 w-5 rounded-full object-cover" />
      } @else {
      <span class="flex h-5 w-5 items-center justify-center rounded-full bg-[#405de6] text-[10px] font-semibold text-white">
        {{ user.username.charAt(0).toUpperCase() }}
      </span>
      }
      {{ user.username }}
      <button type="button" (click)="clearSelected()" aria-label="Bỏ chọn" class="text-[#8e8e8e] hover:text-[#262626]">✕</button>
    </span>
    } @else {
    <input #queryInput type="text" [ngModel]="query()" (ngModelChange)="onQueryInput($event)"
      placeholder="Tìm kiếm..." class="min-w-[120px] flex-1 border-0 bg-transparent text-sm text-[#262626] outline-none placeholder:text-[#8e8e8e]" />
    }
  </div>

  <!-- Results -->
  <div class="flex-1 overflow-y-auto">
    @if (loading()) {
    <div class="flex items-center justify-center py-8">
      <span class="h-6 w-6 animate-spin rounded-full border-2 border-[#dbdbdb] border-t-[#262626]"></span>
    </div>
    } @else {
    @for (user of results(); track user.userId) {
    <button type="button" (click)="select(user)" class="flex w-full items-center gap-3 px-4 py-2.5 text-left hover:bg-[#fafafa]">
      @if (user.avatarUrl) {
      <img [src]="user.avatarUrl" alt="" class="h-11 w-11 flex-shrink-0 rounded-full object-cover" />
      } @else {
      <span class="flex h-11 w-11 flex-shrink-0 items-center justify-center rounded-full bg-[#405de6] text-sm font-semibold text-white">
        {{ user.username.charAt(0).toUpperCase() }}
      </span>
      }
      <div class="min-w-0 flex-1">
        <p class="truncate text-sm font-semibold text-[#262626]">{{ user.username }}</p>
        @if (user.fullName) {
        <p class="truncate text-sm text-[#8e8e8e]">{{ user.fullName }}</p>
        }
      </div>
    </button>
    }
    }
  </div>

  <!-- Chat action -->
  <div class="flex-shrink-0 border-t border-[#dbdbdb] p-3">
    <button type="button" (click)="startChat()" [disabled]="!selected() || starting()"
      class="flex w-full items-center justify-center gap-2 rounded-lg bg-[#0095f6] py-2 text-sm font-semibold text-white disabled:bg-[#b2dffc] disabled:opacity-100">
      @if (starting()) {
      <span class="h-3.5 w-3.5 animate-spin rounded-full border-2 border-white/60 border-t-white"></span>
      }
      Chat
    </button>
  </div>
</div>
