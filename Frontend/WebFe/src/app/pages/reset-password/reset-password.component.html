<section class="min-h-dvh bg-white px-4 pb-4 sm:px-6 sm:pb-6">
  <div class="mx-auto flex min-h-[calc(100dvh-2rem)] w-full max-w-[1280px] border border-zinc-200 bg-white">
    <aside class="hidden w-[52%] flex-col justify-center gap-9 px-10 py-8 lg:flex xl:px-14" aria-hidden="true">
      <img src="/assets/logoLoginLeft.png" alt="Instagram logo" class="h-[78px] w-[78px] object-contain" />

      <h2 class="text-3xl font-medium leading-[2] text-center">
        Đặt lại mật khẩu để<br />
        tiếp tục sử dụng
        <span class="bg-gradient-to-r from-red-500 via-pink-700 to-violet-700 bg-clip-text text-transparent">tài
          khoản</span>
        của bạn.
      </h2>

      <div class="mx-auto w-full max-w-[330px]">
        <img src="/assets/imageLoginLeft.png" alt="Instagram moments" class="block h-auto w-full" />
      </div>
    </aside>

    <main
      class="flex w-full flex-col justify-center p-5 lg:w-[48%] lg:border-l lg:border-zinc-300 lg:px-10 lg:py-9 xl:px-12">
      <div class="mb-6 flex items-center gap-2">
        <h1 class="text-lg font-semibold">Tạo mật khẩu mới</h1>
      </div>

      <p class="mb-6 text-sm text-[var(--color-muted)]">
        Mật khẩu mới phải khác với mật khẩu bạn đã sử dụng trước đây.
      </p>

      @if (error()) {
      <div class="mb-4 flex items-start gap-3 rounded-2xl border border-zinc-200 bg-white px-6 py-4">
        <svg viewBox="0 0 24 24" fill="currentColor" width="1em" height="1em"
          class="w-[20px] h-[20px] text-red-600 flex-shrink-0">
          <g clip-path="url(#_r_rp_err_)">
            <path
              d="M12 10.278c.483 0 .875.391.875.875v4.974a.875.875 0 0 1-1.75 0v-4.974c0-.484.392-.875.875-.875zM12 7.003c.833 0 1.25.4 1.25 1s-.417 1-1.25 1-1.25-.4-1.25-1 .417-1 1.25-1z">
            </path>
            <path fill-rule="evenodd" clip-rule="evenodd"
              d="M12 2c5.523 0 10 4.477 10 10s-4.477 10-10 10S2 17.523 2 12 6.477 2 12 2zm0 2a8 8 0 1 0 0 16 8 8 0 0 0 0-16z">
            </path>
          </g>
          <defs>
            <clipPath id="_r_rp_err_">
              <path d="M0 0H24V24H0z"></path>
            </clipPath>
          </defs>
        </svg>
        <p class="flex-1 font-medium text-gray-800">{{ error() }}</p>
      </div>
      }

      <form [formGroup]="form" (ngSubmit)="submit()" class="grid gap-4" novalidate>
        <div class="w-full">
          <app-input [control]="newPassword" label="Mật khẩu mới" [showTopLabel]="false" type="password"
            autocomplete="new-password" [errorMessage]="'Mật khẩu phải có ít nhất 8 ký tự'"></app-input>
        </div>

        <div class="w-full">
          <app-input [control]="confirmPassword" label="Xác nhận mật khẩu mới" [showTopLabel]="false" type="password"
            autocomplete="new-password" [errorMessage]="'Vui lòng xác nhận mật khẩu mới'"></app-input>
        </div>

        <button
          class="mt-1 flex min-h-11 w-full items-center justify-center rounded-full border-0 font-semibold text-white transition"
          [ngClass]="isSubmitDisabled ? 'cursor-not-allowed bg-[#8ab4e6]/70' : 'cursor-pointer bg-[#1877f2] hover:bg-[#166fe5]'"
          type="submit" [disabled]="isSubmitDisabled">
          @if (!isLoading()) {
          <span>Đặt lại mật khẩu</span>
          } @else {
          <span class="inline-flex items-center gap-2">
            <span class="h-5 w-5 animate-spin rounded-full border-2 border-white/40 border-t-white"></span>
          </span>
          }
        </button>

        <a routerLink="/login"
          class="grid min-h-11 w-full place-items-center rounded-full bg-white font-semibold text-zinc-900 no-underline transition hover:bg-zinc-100 hover:no-underline">
          Quay lại đăng nhập
        </a>
      </form>
    </main>
  </div>
</section>
