<section class="login-page">
  <mat-card class="login-card">
    <div class="login-brand">
      <div class="logo text-2xl">Instagram</div>
      <p class="text-sm">Đăng nhập để tiếp tục kết nối với bạn bè và chia sẻ khoảnh khắc.</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="submit()" class="login-form" novalidate>
      <app-input
        [control]="email!"
        label="Email"
        type="email"
        autocomplete="email"
        placeholder="Nhập email của bạn"
        prefixIcon="email"
        [errorMessage]="'Vui lòng nhập email hợp lệ'"
      ></app-input>

      <app-input
        [control]="password!"
        label="Mật khẩu"
        type="password"
        autocomplete="current-password"
        placeholder="Nhập mật khẩu"
        prefixIcon="lock"
        [errorMessage]="'Mật khẩu là bắt buộc (tối thiểu 6 ký tự)'"
      ></app-input>

      <div class="form-messages">
        <p class="success" *ngIf="success()">{{ success() }}</p>
        <p class="error" *ngIf="error()">{{ error() }}</p>
      </div>

      <button mat-flat-button color="primary" class="submit-button" type="submit" [disabled]="isLoading()">
        <mat-icon>login</mat-icon>
        <span *ngIf="!isLoading()">Đăng nhập</span>
        <span *ngIf="isLoading()">Đang xử lý...</span>
        <mat-progress-spinner *ngIf="isLoading()" diameter="20" mode="indeterminate"></mat-progress-spinner>
      </button>
    </form>

    <div class="login-footer text-sm">
      <span>Chưa có tài khoản?</span>
      <a routerLink="/register">Đăng ký</a>
    </div>
  </mat-card>
</section>
